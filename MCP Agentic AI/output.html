<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP-Agentic-AI — Input / Output Interface (Static)</title>
  </head>
  <body>
    <h1>MCP-Agentic-AI — Static Output</h1>
    <p>This page is intended to be served statically. If you host it on a different origin than the backend, set <code>window.BACKEND_URL</code> to the backend address (e.g. <code>http://localhost:1455</code>).</p>

    <script>
      // Transparent fetch override used by the interactive UI files.
      const BACKEND = (window.BACKEND_URL || '').replace(/\/$/, '');
      (function() {
        const _origFetch = window.fetch.bind(window);
        window.fetch = function(resource, init) {
          try {
            if (typeof resource === 'string') {
              if (resource === '/health' || resource.startsWith('/api/')) {
                const url = BACKEND ? BACKEND + resource : resource;
                return _origFetch(url, init);
              }
            }
          } catch (e) {}
          return _origFetch(resource, init);
        };
      })();

      // Example health probe
      (async function(){
        try{
          const res = await fetch('/health');
          const j = await res.json();
          document.body.insertAdjacentHTML('beforeend', `<pre>Backend status: ${JSON.stringify(j, null, 2)}</pre>`);
        }catch(e){
          document.body.insertAdjacentHTML('beforeend', `<pre>Backend unreachable: ${e}</pre>`);
        }
      })();
    </script>
  </body>
</html>
